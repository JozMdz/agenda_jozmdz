  background:linear-gradient(180deg,rgba(11,12,22,.55),rgba(11,12,22,.9))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none; overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid color-mix(in srgb,var(--escuela) 70%,transparent);outline-offset:2px}
.btn-p:focus-visible{outline-color:#fff}
.hide{display:none!important}
.mono{font-family:var(--mono)}

/* ---------- Login ---------- */
#login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px}
.lg-mark{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim2);margin-bottom:10px}
.lg-h{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:.06em;margin:0 0 6px}
.lg-s{color:var(--dim);margin:0 0 30px;line-height:1.5;font-size:14px}
.lg-form{display:flex;flex-direction:column;gap:12px;max-width:380px}
.lg-err{color:var(--alert);font-size:13px;min-height:18px;margin-top:4px}

/* ---------- Campos ---------- */
.fld{width:100%;padding:13px 14px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:10px;font-size:16px}
.fld::placeholder{color:var(--dim2)}
select.fld{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.lab{display:block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim2);margin:16px 0 7px}
.btn{padding:14px 18px;border-radius:12px;font-weight:600;font-size:15px;
  background:color-mix(in srgb,var(--tx) 5%,transparent);border:1.5px solid var(--line);text-align:center;
  transition:transform .09s ease,filter .12s ease,background .12s ease}
.btn:active{transform:scale(.96);filter:brightness(1.25)}
.btn-p{background:linear-gradient(135deg,var(--escuela),var(--trabajo));color:#fff;
  border-color:transparent;box-shadow:0 4px 14px rgba(232,155,35,.30)}
.btn-p:active{filter:brightness(1.15)}
.btn-p:disabled{opacity:.4;box-shadow:none}
.mact button,.chip,.dchip,.seg button,.ag-arrow,.fab{transition:transform .09s ease,filter .12s ease}
.mact button:active,.chip:active,.dchip:active,.seg button:active,.ag-arrow:active,.fab:active{
  transform:scale(.94);filter:brightness(1.3)}
.row-b:active,.chk:active,.mes-d:active,.pcard:active,.sch-cell.act:active{filter:brightness(1.35)}
.btn-d{color:var(--alert);border-color:transparent;background:none;font-size:13px}

/* ---------- Shell ---------- */
#app{min-height:100dvh;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.hd{background:rgba(11,12,22,.58);backdrop-filter:blur(14px);padding:calc(16px + env(safe-area-inset-top)) 18px 14px;display:flex;
  align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.hd-t{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;margin:0}
.hd-d{color:var(--dim);font-size:12.5px;margin:3px 0 0;text-transform:capitalize}
.hd-r{display:flex;align-items:center;gap:12px;flex:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--alert)}
.hd-out{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

.view{padding:0 0 24px}
.sec{margin-top:22px;padding:0 18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-t{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim);margin:0}
.sec-t.alert{color:var(--alert)}
.sec-a{font-size:12.5px;color:var(--escuela);font-weight:600}

/* ---------- Widget Dashboard (Inicio) ---------- */
.w-card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px;
  display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:stretch;margin-top:14px}
.w-sheet{background:#FFFFFF;color:#1A1C28;border-radius:18px;display:flex;flex-direction:column;
  overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35);text-align:center}
.w-sheet-h{background:#FF3B30;color:#FFFFFF;font-family:var(--mono);font-size:12px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;padding:6px 0}
.w-sheet-b{padding:6px 0 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;flex:1}
.w-sheet-n{font-size:52px;font-weight:800;line-height:1;letter-spacing:-0.03em;color:#111827}
.w-sheet-d{font-size:13px;font-weight:600;color:#6B7280;text-transform:capitalize;margin-top:2px}
.w-side{display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-width:0}

/* ---------- Menú Lateral (Sidebar) ---------- */
.sidebar{position:fixed;top:0;bottom:0;left:-300px;width:280px;background:var(--panel);z-index:90;
  transition:left 0.3s cubic-bezier(0.4, 0, 0.2, 1);border-right:1px solid var(--line);
  display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,0.5);}
.sidebar.open{left:0;}
.side-ov{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:80;backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity 0.3s;}
.side-ov.open{opacity:1;pointer-events:auto;}
.side-nav{flex:1;overflow-y:auto;padding:20px 12px;display:flex;flex-direction:column;gap:4px;}
.side-nav button{padding:14px 16px;border-radius:12px;font-size:15px;font-weight:600;color:var(--dim);
  display:flex;align-items:center;gap:14px;text-align:left;}
.side-nav button.on{background:color-mix(in srgb,var(--tx) 8%,transparent);color:var(--tx);}
.side-nav .ic{font-size:20px;}
.side-ft{padding:16px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:12px;}
.side-ft button{text-align:left;color:var(--dim);font-size:14px;display:flex;align-items:center;gap:10px;font-weight:500;}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 18px;margin-top:18px}
.kpi{background:color-mix(in srgb,var(--tx) 4%,transparent);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);padding:12px 11px}
.kpi-n{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1}
.kpi-l{font-size:10.5px;color:var(--dim);margin-top:5px;line-height:1.25}

/* ---------- Carril de la semana (firma) ---------- */
.rail{display:flex;gap:5px;padding:0 18px;margin-top:20px;align-items:flex-end}
.rail-d{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.rail-stack{width:100%;height:52px;display:flex;flex-direction:column;justify-content:flex-end;
  gap:2px;background:var(--panel);border-radius:5px;padding:3px;border:1px solid transparent}
.rail-d.today .rail-stack{border-color:var(--dim2)}
.rail-seg{width:100%;border-radius:2px;min-height:3px}
.rail-l{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2)}
.rail-n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--dim)}
.rail-d.today .rail-l,.rail-d.today .rail-n{color:var(--tx)}

/* ---------- Renglón de tarea ---------- */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);
  border-radius:14px;overflow:hidden;backdrop-filter:blur(6px)}
.row-b{padding-left:13px}
.row-b{flex:1;text-align:left;padding:12px 8px 12px 4px;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-t{font-size:14.5px;font-weight:600;line-height:1.3;word-break:break-word}
.row-m{font-size:11.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.row-m .sep{color:var(--dim2)}
.row-n{font-size:11.5px;color:var(--dim2);line-height:1.35}
.row.done .row-t{text-decoration:line-through;opacity:.45}
.row.done .row-m{opacity:.6}
.pill{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--panel2)}
.pill.late{background:color-mix(in srgb,var(--alert) 20%,transparent);color:var(--alert)}
.pill.hi{background:var(--hueso);color:#14243D;font-weight:700}
.chk{width:48px;flex:none;display:flex;align-items:center;justify-content:center}
.chk-b{width:23px;height:23px;border-radius:6px;border:1.6px solid var(--line);background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.time{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--dim)}
.bar-mini{height:3px;border-radius:2px;background:var(--panel2);overflow:hidden;margin-top:7px}
.bar-mini i{display:block;height:100%;border-radius:2px}

.busca{margin:12px 18px 0;position:relative}
.busca input{width:100%;padding:11px 13px 11px 36px;background:color-mix(in srgb,var(--tx) 5%,transparent);
  border:1px solid var(--line);border-radius:12px;font-size:15px}
.busca span{position:absolute;left:13px;top:11px;color:var(--dim2);font-size:14px}
.mact{display:flex;gap:8px;padding:10px 18px 0}
.mact button{flex:1;padding:9px;border-radius:11px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--tx) 4%,transparent);font-size:12.5px;font-weight:600;color:var(--dim)}
.mnu{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.mnu button{text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px}
.mnu button:last-child{border-bottom:none}
.mnu small{display:block;color:var(--dim2);font-size:12px;margin-top:2px}

/* ---------- Chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--dim);white-space:nowrap}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.dchips{display:flex;gap:6px;flex-wrap:wrap}
.dchip{flex:1;min-width:42px;padding:9px 2px;border-radius:8px;border:1.5px solid var(--line);
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--dim);text-align:center}
.dchip.on{background:var(--escuela);border-color:var(--escuela);color:var(--bg)}

/* ---------- Agenda ---------- */
.ag-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px}
.ag-nav{display:flex;align-items:center;gap:10px}
.ag-arrow{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--line);
  font-size:15px;display:flex;align-items:center;justify-content:center}
.ag-when{font-family:var(--mono);font-size:12.5px;font-weight:600;text-transform:capitalize;min-width:96px;text-align:center}
.ag-tog{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.ag-tog button{padding:6px 12px;font-size:12px;font-weight:600;color:var(--dim)}
.ag-tog button.on{background:var(--panel2);color:var(--tx)}
.grid{position:relative;margin:0 18px;border-top:1px solid var(--line)}
.grid-h{display:flex;position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--line)}
.grid-h .gh-sp{width:38px;flex:none}
.gh-d{flex:1;text-align:center;padding:7px 2px;font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);min-width:0}
.gh-d.today{color:var(--tx)}
.gh-d b{display:block;font-size:13px;font-weight:700;margin-top:1px}
.grid-b{display:flex;position:relative}
.hours{width:38px;flex:none}
.hr{height:44px;border-bottom:1px solid var(--line);position:relative}
.hr span{position:absolute;top:-7px;right:6px;font-family:var(--mono);font-size:9.5px;color:var(--dim2)}
.cols{flex:1;display:flex;position:relative;min-width:0}
.col{flex:1;position:relative;border-left:1px solid var(--line);min-width:0}
.col.today{background:color-mix(in srgb,var(--tx) 2.5%,transparent)}
.slot{height:44px;border-bottom:1px solid var(--line)}
.blk{position:absolute;left:2px;right:2px;border-radius:6px;padding:4px 6px;overflow:hidden;
  border-left:3px solid;font-size:11px;line-height:1.25;text-align:left}
.blk b{display:block;font-weight:600;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk i{font-style:normal;font-family:var(--mono);font-size:9.5px;opacity:.75}
.blk.done{opacity:.45}
.now{position:absolute;left:0;right:0;height:1.5px;background:var(--alert);z-index:2;pointer-events:none}
.now::before{content:'';position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--alert)}

.grid-ad{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
.grid-ad .gh-sp{width:38px;flex:none;font-family:var(--mono);font-size:8.5px;color:var(--dim2);
  display:flex;align-items:center;justify-content:flex-end;padding-right:5px;text-align:right;line-height:1.1}
.ad-c{flex:1;min-width:0;padding:4px 2px;display:flex;flex-direction:column;gap:3px;
  border-left:1px solid var(--line);min-height:26px}
.ad-i{font-size:10px;padding:3px 5px;border-radius:5px;border-left:2.5px solid;text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mas{display:block;width:100%;text-align:center;margin-top:16px;padding:11px;
  font-size:13.5px;font-weight:600;color:var(--escuela)}

/* ---------- Mes ---------- */
.mes{margin:2px 14px 0;}
.mes-h{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.mes-h span{text-align:center;font-size:11px;font-weight:600;color:var(--dim2);
  text-transform:uppercase;letter-spacing:.05em}
.mes-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mes-d{aspect-ratio:1/1.08;border-radius:13px;background:color-mix(in srgb,var(--tx) 4%,transparent);position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.mes-d.out{opacity:.28}
.mes-n{font-size:15.5px;font-weight:600;width:28px;height:28px;display:flex;
  align-items:center;justify-content:center;border-radius:50%}
.mes-d.today .mes-n{background:var(--alert);color:#fff;font-weight:700}
.mes-d.sel{box-shadow:inset 0 0 0 2px var(--escuela)}
.mes-dots{display:flex;gap:3.5px;height:6px}
.mes-dots i{width:6px;height:6px;border-radius:50%}

/* ---------- Proyectos ---------- */
.pcard{border:1px solid var(--line);border-radius:16px;padding:15px;backdrop-filter:blur(6px);
  display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.pcard-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pcard-t{font-size:15.5px;font-weight:600;line-height:1.25}
.pcard-d{font-size:12.5px;color:var(--dim);line-height:1.4}
.pcard-s{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--dim2)}

/* ---------- Horario ---------- */
.sch-grid{display:grid;grid-template-columns:50px repeat(5,1fr);gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:8px}
.sch-h{font-family:var(--mono);font-size:11px;font-weight:700;text-align:center;color:var(--dim2);padding:8px 0;text-transform:uppercase}
.sch-time{font-family:var(--mono);font-size:11.5px;color:var(--dim2);display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.sch-cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:85px;padding:8px 4px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.sch-cell.act{background:color-mix(in srgb,var(--escuela) 18%,var(--panel));border-color:color-mix(in srgb,var(--escuela) 55%,transparent);cursor:pointer;transition:transform .09s ease,filter .12s ease;}
.sch-tag{font-size:12.5px;font-weight:700;color:var(--escuela);line-height:1.2;word-break:break-word;margin-bottom:4px}
.sch-sub{font-size:10px;color:var(--dim);line-height:1.2;word-break:break-word}

/* ---------- Bitácora ---------- */
.note{background:color-mix(in srgb,var(--tx) 4%,transparent);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.note-m{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim2);display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.note-x{font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}

/* ---------- Repaso ---------- */
.rp{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.rp-k{width:74px;flex:none;font-size:13px;font-weight:600}
.rp-bar{flex:1;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.rp-bar i{display:block;height:100%;border-radius:4px}
.rp-n{width:56px;flex:none;text-align:right;font-family:var(--mono);font-size:12px;color:var(--dim)}

/* ---------- Vacío ---------- */
.empty{text-align:center;padding:34px 24px;color:var(--dim2)}
.empty b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.empty span{font-size:13px;line-height:1.5}

/* ---------- FAB / Voz ---------- */
.fab{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:29;
  width:54px;height:54px;border-radius:50%;background:var(--tx);color:var(--bg);
  font-size:27px;font-weight:400;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.4)}
.mic{position:fixed;right:24px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:29;
  width:54px;height:54px;border-radius:50%;color:#fff;font-size:23px;
  background:linear-gradient(135deg,var(--escuela),var(--personal));
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.45)}

.voz{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;text-align:center}
.voz-orb{width:104px;height:104px;border-radius:50%;
  background:linear-gradient(135deg,var(--escuela),var(--personal),var(--alto));
  animation:pulso 1.5s ease-in-out infinite;box-shadow:0 0 60px rgba(232,155,35,.38)}
@keyframes pulso{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.13);opacity:1}}
.voz-h{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0}
.voz-tx{font-size:21px;line-height:1.4;margin:0;max-width:460px;min-height:62px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:70;
  background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:13px 15px;
  display:flex;align-items:center;gap:13px;box-shadow:0 8px 28px rgba(0,0,0,.55);
  max-width:560px;margin:0 auto}
@media (prefers-reduced-motion:reduce){.voz-orb{animation:none}}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;
  align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);backdrop-filter:blur(20px);width:100%;max-width:560px;max-height:93dvh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:8px 18px calc(26px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(22px)}to{transform:none}}
.grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:7px auto 14px}
.sheet-h{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;margin:0 0 4px}
.sheet-s{font-size:12.5px;color:var(--dim);margin:0 0 8px}
.seg{display:flex;gap:7px}
.seg button{flex:1;padding:10px 3px;border-radius:9px;border:1.5px solid var(--line);
  font-size:13px;font-weight:600;color:var(--dim)}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
.acts{display:flex;gap:10px;margin-top:22px}.acts .btn{flex:1}
.cl-row{display:flex;align-items:center;gap:9px;padding:7px 0}
.cl-row input[type=text]{flex:1;background:none;border:none;border-bottom:1px solid var(--line);padding:4px 0;font-size:14px}
.cl-x{color:var(--dim2);font-size:16px;padding:0 4px}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media(min-width:760px){
  body{font-size:16px}
  #app{max-width:900px;margin:0 auto;box-shadow:0 0 0 1px var(--line);min-height:100dvh}
  .hd{border-radius:0}
  .hd-t{font-size:24px}
  .kpi-n{font-size:30px}
  .fab{right:calc(50% - 450px + 24px)}
  .mic{right:calc(50% - 450px + 24px)}
  .sheet{max-width:640px}
}
@media(min-width:1024px){
  body{display:flex;justify-content:center}
  #app{width:900px}
}
</style>
</head>

const dISO = k => { const [a,b,c] = k.split("-").map(Number); return new Date(a,b-1,c); };
const addD = (k,n) => { const d = dISO(k); d.setDate(d.getDate()+n); return iso(d); };
const lunes = k => { const d = dISO(k); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return iso(d); };
const hm2m = t => { if(!t) return null; const [h,m] = t.split(":").map(Number); return h*60+m; };
const m2hm = m => `${p2(Math.floor(m/60))}:${p2(m%60)}`;
const corto = t => t ? t.slice(0,5) : "";
const nomDia = k => {
  const t = hoyISO();
  if (k===t) return "Hoy";
  if (k===addD(t,1)) return "Mañana";
  if (k===addD(t,-1)) return "Ayer";
  return dISO(k).toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"");
};
const largo = d => d.toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===================== Clima ===================== */
const WMO = {
  0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌧️",53:"🌧️",55:"🌧️",
  61:"🌧️",63:"🌧️",65:"🌧️",71:"🌨️",73:"🌨️",75:"🌨️",80:"🌧️",81:"🌧️",82:"🌧️",
  95:"⛈️",96:"⛈️",99:"⛈️"
};

function obtenerCoordenadas() {
  return new Promise((resolve) => {
    const tampico = { lat: 22.256, lon: -97.862 };
    if (!navigator.geolocation) return resolve(tampico);
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      err => resolve(tampico),
      { timeout: 4000 }
    );
  });
}

async function obtenerClima() {
  const widget = $("w-clima");
  if(!widget) return;
  
  const cacheStr = localStorage.getItem("tablero_clima");
  const cache = cacheStr ? JSON.parse(cacheStr) : {};
  const ahora = Date.now();
  
  if(cache.temp !== undefined && cache.time && (ahora - cache.time < 1800000)){
    widget.innerHTML = `${WMO[cache.code]||"🌤️"} ${cache.temp}°`;
    return;
  }

  const { lat, lon } = await obtenerCoordenadas();
  
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
    const data = await res.json();
    const t = Math.round(data.current_weather.temperature);
    const c = data.current_weather.weathercode;
    localStorage.setItem("tablero_clima", JSON.stringify({temp:t, code:c, time:ahora}));
    if($("w-clima")) $("w-clima").innerHTML = `${WMO[c]||"🌤️"} ${t}°`;
  } catch(e) {
    if($("w-clima")) $("w-clima").innerHTML = `🌤️ --°`;
  }
}

/* ===================== Tema ===================== */
function aplicarTema(t){
  document.body.classList.toggle("light-theme", t === "light");
  const mc = document.querySelector('meta[name="theme-color"]');
  if (mc) mc.setAttribute("content", t === "light" ? "#F4F7FB" : "#0B0C16");
}
(function initTema(){
  const guardado = localStorage.getItem("tema");
  aplicarTema(guardado === "light" ? "light" : "dark");
})();
function alternarTema(){
  const actual = document.body.classList.contains("light-theme") ? "light" : "dark";
  const nuevo = actual === "light" ? "dark" : "light";
  localStorage.setItem("tema", nuevo);
  aplicarTema(nuevo);
  if($("s-tema")) $("s-tema").innerHTML = actual === "light" ? "🌗 Cambiar a Claro" : "🌗 Cambiar a Oscuro";
}

/* ===================== Sesión ===================== */
const $ = id => document.getElementById(id);

async function entrar(){
  const err = $("lg-err"); err.textContent = "";
  const email = $("lg-mail").value.trim(), password = $("lg-pass").value;
  if(!email || !password){ err.textContent = "Escribe tu correo y contraseña."; return; }
  $("lg-go").disabled = true; $("lg-go").textContent = "Entrando…";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $("lg-go").disabled = false; $("lg-go").textContent = "Entrar";
  if(error) err.textContent = "No se pudo entrar. Revisa el correo y la contraseña.";
}

async function arranque(){
  const { data } = await sb.auth.getSession();
  if(data.session){ S.user = data.session.user; await abrir(); }
  else { $("login").classList.remove("hide"); }
}

async function abrir(){
  $("login").classList.add("hide");
  $("app").classList.remove("hide");
  S.agFecha = hoyISO();
  await cargar();
  suscribir();
  render(true);

  // Reloj en vivo (sin renderizar toda la vista)
  setInterval(() => { 
    if($("live-clock")) $("live-clock").textContent = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  }, 1000);

  // Actualización silenciosa de agenda cada minuto (sin scroll)
  setInterval(() => { 
    if(S.tab==="agenda") {
      const prevScroll = window.scrollY;
      render(false);
      window.scrollTo(0, prevScroll);
    }
  }, 60000);
}

/* ===================== Datos ===================== */
async function cargar(){
  try{
    const [pr,ta,no] = await Promise.all([
      sb.from("ag_proyectos").select("*").order("creado_en"),
      sb.from("ag_tareas").select("*").order("creado_en"),
      sb.from("ag_notas").select("*").order("creado_en",{ascending:false})
    ]);
    if(pr.error||ta.error||no.error) throw (pr.error||ta.error||no.error);
    S.proyectos = pr.data || []; S.tareas = ta.data || []; S.notas = no.data || [];
    try{ const r = await sb.from("ag_rutinas").select("*").order("nombre"); S.rutinas = r.data || []; }catch(_){ S.rutinas = []; }
    try{ const m = await sb.from("ag_materias").select("*").order("clave"); S.materias = m.data || []; }catch(_){ S.materias = []; }
    $("dot").classList.remove("off"); $("dot").title = "Conectado";
  }catch(e){
    $("dot").classList.add("off"); $("dot").title = "Sin conexión con la base";
    console.error(e);
  }
}

function suscribir(){
  ["ag_tareas","ag_proyectos","ag_notas","ag_materias"].forEach(t =>
    sb.channel("ch_"+t)
      .on("postgres_changes",{event:"*",schema:"public",table:t}, async () => { await cargar(); render(false); })
      .subscribe()
  );
}

async function guardar(tabla, fila){
  const q = fila.id
    ? sb.from(tabla).update(fila).eq("id", fila.id)
    : sb.from(tabla).insert(Array.isArray(fila) ? fila : [fila]);
  const { error } = await q;
  if(error){ alert("No se guardó: " + error.message); return false; }
  await cargar(); render(false); return true;
}
async function borrar(tabla, id){
  const { error } = await sb.from(tabla).delete().eq("id", id);
  if(error){ alert("No se eliminó: " + error.message); return; }
  await cargar(); render(false);
}

/* ===================== Selectores ===================== */
const abiertas  = () => S.tareas.filter(t => !t.hecha);
const vencidas  = () => abiertas().filter(t => t.fecha && t.fecha < hoyISO());
const deHoy     = () => abiertas().filter(t => t.fecha === hoyISO());
const porArea   = ls => S.filtro==="todas" ? ls : ls.filter(t => t.area===S.filtro);
const ordena    = ls => [...ls].sort((a,b) =>
  (a.fecha||"9999").localeCompare(b.fecha||"9999") ||
  ((!!b.hora)-(!!a.hora)) || (a.hora||"").localeCompare(b.hora||"") ||
  ((b.alta?1:0)-(a.alta?1:0)) || (a.creado_en||"").localeCompare(b.creado_en||"")
);
const proyDe = id => S.proyectos.find(p => p.id===id);

/* ===================== Render ===================== */
function render(scroll = true){
  $("hd-d").textContent = largo(new Date());
  $("hd-t").textContent = {hoy:"Inicio",pendientes:"Pendientes",agenda:"Agenda",proyectos:"Proyectos",horario:"Horario",repaso:"Repaso"}[S.tab];
  document.querySelectorAll(".side-nav button").forEach(b => b.classList.toggle("on", b.dataset.tab===S.tab));
  const v = $("view");
  v.innerHTML = ({hoy:vHoy,pendientes:vPendientes,agenda:vAgenda,proyectos:vProyectos,horario:vHorario,repaso:vRepaso})[S.tab]();
  
  if(scroll) v.scrollIntoView({block:"start"});
  
  if(S.tab === "hoy") obtenerClima();

  enlazar();
}

  const mesNom = now.toLocaleDateString("es-MX", { month:"long" });
  const diaSem = now.toLocaleDateString("es-MX", { weekday:"long" });
  const tUrgent = ordena(hoy).find(t => t.alta) || hoy[0] || late[0];

  let h = `<div class="sec" style="margin-top:14px">
    <div class="w-card">
      <div class="w-sheet">
        <div class="w-sheet-h">${mesNom}</div>
        <div class="w-sheet-b">
          <div class="w-sheet-n">${now.getDate()}</div>
          <div class="w-sheet-d">${diaSem}</div>
        </div>
      </div>
      <div class="w-side" style="justify-content: center; padding-left:4px;">
        <div style="display:flex; justify-content: space-between; align-items: center; border-bottom:1px solid var(--line); padding-bottom:10px;">
          <span style="font-size:28px; font-weight:700; font-family:var(--mono); color:var(--tx);" id="live-clock">${now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</span>
          <span style="font-size:22px;" id="w-clima" title="Clima">...</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:4px; margin-top:8px;">
           <div style="font-size:12px; color:var(--dim2); font-weight:600; text-transform:uppercase; letter-spacing:0.05em;">Resumen del día</div>
           <div style="font-size:13.5px; line-height: 1.4; color:var(--dim);"><b>${hoy.length}</b> pendientes hoy, <b>${late.length}</b> arrastradas. Has cerrado <b>${cerradasHoy}</b>.</div>
        </div>
      </div>
    </div>
  </div>`;

  const altas = ordena(abiertas()).filter(t => t.alta);
  if(altas.length) {
     h += `<div class="sec"><div class="sec-h"><h2 class="sec-t alert">Prioridad Alta</h2></div>
           <ul class="list">${altas.map(t=>fila(t,true)).join("")}</ul></div>`;

/* ---------- PENDIENTES ---------- */
function vPendientes(){
  const hoy = deHoy(), late = vencidas();
  const cerradasHoy = S.tareas.filter(t => t.hecha && localISO(t.hecha_en)===hoyISO()).length;

  let h = `<div class="kpis">
    <div class="kpi"><div class="kpi-n">${hoy.length}</div><div class="kpi-l">pendientes hoy</div></div>
    <div class="kpi"><div class="kpi-n" style="color:${late.length?"var(--alert)":"inherit"}">${late.length}</div><div class="kpi-l">arrastradas</div></div>
    <div class="kpi"><div class="kpi-n" style="color:var(--ok)">${cerradasHoy}</div><div class="kpi-l">cerradas hoy</div></div>
  </div>`;

  /* carril de la semana */
  const l = lunes(hoyISO());
  const max = Math.max(1, ...Array.from({length:7},(_,i)=> abiertas().filter(t=>t.fecha===addD(l,i)).length));
  h += `<div class="rail">` + Array.from({length:7},(_,i)=>{
    const k = addD(l,i), ts = abiertas().filter(t=>t.fecha===k);
    const segs = Object.keys(AREAS).map(a=>{
      const n = ts.filter(t=>t.area===a).length;
      return n ? `<span class="rail-seg" style="background:${AREAS[a].v};flex:${n}"></span>` : "";
    }).join("");
    const alto = ts.length ? Math.max(20, Math.round(ts.length/max*100)) : 0;
    return `<button class="rail-d ${k===hoyISO()?"today":""}" data-goto="${k}">
      <span class="rail-n">${ts.length||"·"}</span>
      <span class="rail-stack"><span style="display:flex;flex-direction:column;gap:2px;height:${alto}%;justify-content:flex-end">${segs}</span></span>
      <span class="rail-l">${DIAS[i]}</span></button>`;
  }).join("") + `</div>`;

  /* buscador */
  const q = (S.q||"").trim().toLowerCase();
  const coincide = t => !q || (t.titulo+" "+(t.nota||"")+" "+(proyDe(t.proyecto_id)?.nombre||"")).toLowerCase().includes(q);
  h += `<div class="busca"><span>&#9906;</span><input id="q" value="${esc(S.q||"")}" placeholder="Buscar tarea, nota o proyecto"></div>`;

  /* filtros de área + hechas */
  h += `<div class="chips">` +
    [["todas","Todas"],...Object.entries(AREAS).map(([k,a])=>[k,a.l])]
      .map(([k,lb])=>`<button class="chip ${S.filtro===k?"on":""}" data-filtro="${k}" style="${
        S.filtro===k&&AREAS[k]?`background:${AREAS[k].v};border-color:${AREAS[k].v};color:#fff`
        :AREAS[k]?`color:${AREAS[k].v};border-color:${AREAS[k].v}`:""}">${lb}</button>`).join("") +
    `<button class="chip ${S.verHechas?"on":""}" data-hechas="1" style="${S.verHechas?"":"border-color:var(--ok);color:var(--ok)"}">${S.verHechas?"↩ Abiertas":"✓ Hechas"}</button></div>`;

  /* lista */
  const ls = (S.verHechas
    ? porArea(S.tareas.filter(t=>t.hecha)).sort((a,b)=>(b.hecha_en||"").localeCompare(a.hecha_en||""))
    : ordena(porArea(abiertas()))).filter(coincide);

  if(!ls.length)
    return h + `<div class="empty"><b>${q?"Sin coincidencias":"Sin tareas"}</b><span>${
      q?"Prueba con otra palabra." : S.verHechas?"Aquí se archiva lo que vas cerrando.":"Toca + para abrir la primera."}</span></div>`;

  if(S.verHechas)
    return h + `<div class="sec"><ul class="list">${ls.map(t=>fila(t,true)).join("")}</ul></div>`;

  const grupos = {};
  ls.forEach(t => { const k = !t.fecha ? "zz" : t.fecha < hoyISO() ? "00" : t.fecha; (grupos[k] ||= []).push(t); });
  Object.keys(grupos).sort().forEach(k=>{
    const lab = k==="00" ? "Arrastradas" : k==="zz" ? "Sin fecha" : nomDia(k);
    h += `<div class="sec"><div class="sec-h"><h2 class="sec-t ${k==="00"?"alert":""}">${lab}<span style="opacity:.55"> ${grupos[k].length}</span></h2>` +
      (k==="00" ? `<button class="sec-a" data-alhoy="1">Pasar todas a hoy</button>` : "") + `</div>
      <ul class="list">${grupos[k].map(t=>fila(t, k!=="00" && k!=="zz" ? false : true)).join("")}</ul></div>`;
  });
  return h;
}

function fila(t, verFecha){
  const a = AREAS[t.area] || AREAS.personal;
  const late = !t.hecha && t.fecha && t.fecha < hoyISO();
  const pr = proyDe(t.proyecto_id);
  const cl = Array.isArray(t.checklist) ? t.checklist : [];
  const hechos = cl.filter(c=>c.h).length;
  const meta = [
    t.hora ? `<span class="time">${corto(t.hora)}</span>` : (t.fecha ? `<span class="pill">todo el día</span>` : ""),
    verFecha||late ? `<span>${nomDia(t.fecha)}</span>` : "",
    pr ? `<span>${esc(pr.nombre)}</span>` : "",
    cl.length ? `<span>${hechos}/${cl.length}</span>` : "",
    late ? `<span class="pill late">vencida</span>` : "",
    t.alta && !t.hecha ? `<span class="pill hi">alta</span>` : "",
    t.hecha && t.hecha_en ? `<span style="color:var(--ok)">cerrada ${localHora(t.hecha_en)}</span>` : ""
  ].filter(Boolean).join(`<span class="sep">·</span>`);

  return `<li class="row ${t.hecha?"done":""}" style="border-color:color-mix(in srgb,${a.v} 52%,transparent);
      background:color-mix(in srgb,${a.v} 9%,var(--panel))">
    <button class="row-b" data-abrir="${t.id}">
      <span class="row-t">${esc(t.titulo)}</span>
      <span class="row-m"><span style="color:${a.v};font-weight:600">${a.l}</span>${meta?`<span class="sep">·</span>${meta}`:""}</span>
      ${t.nota?`<span class="row-n">${esc(t.nota)}</span>`:""}
      ${cl.length?`<span class="bar-mini"><i style="width:${Math.round(hechos/cl.length*100)}%;background:${a.v}"></i></span>`:""}
    </button>
    <button class="chk" data-check="${t.id}" aria-label="${t.hecha?"Reabrir":"Marcar como hecha"}">
      <span class="chk-b" style="${t.hecha?`border-color:${a.v};color:${a.v}`:""}">${t.hecha?"✓":""}</span>
    </button></li>`;
}

/* --- Mes --- */
function vMes(){
  const d = dISO(S.agFecha), y = d.getFullYear(), m = d.getMonth();
  const primero = iso(new Date(y,m,1));
  const off = (dISO(primero).getDay()+6)%7;
  const dim = new Date(y,m+1,0).getDate();
  const filas = Math.ceil((off+dim)/7);
  const ini = lunes(primero);

  let h = barraAg(d.toLocaleDateString("es-MX",{month:"long",year:"numeric"}));
  h += `<div class="mes"><div class="mes-h">${DIAS.map(x=>`<span>${x}</span>`).join("")}</div><div class="mes-g">`;
  for(let i=0;i<filas*7;i++){
    const k = addD(ini,i), dd = dISO(k);
    const ts = porArea(S.tareas).filter(t=>t.fecha===k && !t.hecha);
    const dots = Object.keys(AREAS).filter(a=>ts.some(t=>t.area===a))
      .map(a=>`<i style="background:${AREAS[a].v}"></i>`).join("");
    h += `<button class="mes-d ${dd.getMonth()!==m?"out":""} ${k===hoyISO()?"today":""} ${k===S.agFecha?"sel":""}" data-dia="${k}">
      <span class="mes-n">${dd.getDate()}</span><span class="mes-dots">${dots}</span></button>`;
  }
  h += `</div></div>`;

  const sel = ordena(porArea(S.tareas).filter(t=>t.fecha===S.agFecha));
  h += `<div class="sec"><div class="sec-h"><h2 class="sec-t">${nomDia(S.agFecha)}</h2>
    <button class="sec-a" data-verdia="1">Ver por horas ›</button></div>` +
    (sel.length ? `<ul class="list">${sel.map(t=>fila(t)).join("")}</ul>`
      : `<div class="empty"><span>Nada este día. Toca + para agendar.</span></div>`) + `</div>`;
  return h;
}

/* --- Semana y Día --- */
function vRejilla(){
  const semana = S.agModo==="semana";
  const base = semana ? lunes(S.agFecha) : S.agFecha;
  const dias = semana ? Array.from({length:7},(_,i)=>addD(base,i)) : [S.agFecha];
  const titulo = semana
    ? `${dISO(base).toLocaleDateString("es-MX",{day:"numeric",month:"short"})} – ${dISO(addD(base,6)).toLocaleDateString("es-MX",{day:"numeric",month:"short"})}`
    : `${nomDia(S.agFecha)} ${dISO(S.agFecha).toLocaleDateString("es-MX",{day:"numeric",month:"short"})}`;

  let h = barraAg(titulo);
  h += `<div class="grid"><div class="grid-h"><span class="gh-sp"></span>` +
    dias.map(k=>`<span class="gh-d ${k===hoyISO()?"today":""}">${semana?DIAS[(dISO(k).getDay()+6)%7]:""}<b>${dISO(k).getDate()}</b></span>`).join("") +
    `</div><div class="grid-ad"><span class="gh-sp">todo<br>el día</span>` +
    dias.map(k=>`<span class="ad-c">` + porArea(S.tareas).filter(t=>t.fecha===k && !t.hora).map(t=>{
      const a = AREAS[t.area]||AREAS.personal;
      return `<button class="ad-i ${t.hecha?"done":""}" data-abrir="${t.id}"
        style="border-left-color:${a.v};background:color-mix(in srgb,${a.v} 22%,transparent)">${esc(t.titulo)}</button>`;
    }).join("") + `</span>`).join("") +
    `</div><div class="grid-b"><div class="hours">` +
    Array.from({length:H1-H0},(_,i)=>`<div class="hr"><span>${p2(H0+i)}</span></div>`).join("") +
    `</div><div class="cols">`;

  const ahora = new Date();
  dias.forEach(k=>{
    const hoyEs = k===hoyISO();
    h += `<div class="col ${hoyEs?"today":""}">` +
      Array.from({length:H1-H0},(_,i)=>`<div class="slot" data-slot="${k}|${p2(H0+i)}:00"></div>`).join("");
    porArea(S.tareas).filter(t=>t.fecha===k && t.hora).forEach(t=>{
      const a = AREAS[t.area]||AREAS.personal;
      const top = (hm2m(t.hora)-H0*60)/60*PX;
      if(top < -20) return;
      const alto = Math.max(20,(t.duracion||30)/60*PX-2);
      h += `<button class="blk ${t.hecha?"done":""}" data-abrir="${t.id}"
        style="top:${top}px;height:${alto}px;border-left-color:${a.v};background:color-mix(in srgb,${a.v} 26%,var(--panel))">
        <b>${esc(t.titulo)}</b><i>${corto(t.hora)}</i></button>`;
    });
    if(hoyEs){
      const y = (ahora.getHours()*60+ahora.getMinutes()-H0*60)/60*PX;
      if(y>0 && y<(H1-H0)*PX) h += `<div class="now" style="top:${y}px"></div>`;
    }
    h += `</div>`;
  });
  return h + `</div></div></div>`;
}

/* ---------- PROYECTOS ---------- */
function vProyectos(){
  if(S.proy) return vProyecto(S.proy);
  const act = S.proyectos.filter(p=>!p.archivado);
  if(!act.length) return `<div class="empty"><b>Sin proyectos</b><span>Un proyecto agrupa tareas y su bitácora: la tesis, una auditoría, un pendiente de casa. Toca + para crear uno.</span></div>`;
  return `<div class="sec"><div class="list">` + act.map(p=>{
    const a = AREAS[p.area]||AREAS.personal;
    const ts = S.tareas.filter(t=>t.proyecto_id===p.id);
    const hechas = ts.filter(t=>t.hecha).length;
    const pct = ts.length ? Math.round(hechas/ts.length*100) : 0;
    const dr = p.vence ? Math.round((dISO(p.vence)-dISO(hoyISO()))/864e5) : null;
    const cd = dr===null ? "" : dr<0 ? `<span class="pill late">${-dr} d tarde</span>`
      : dr===0 ? `<span class="pill late">hoy</span>`
      : `<span class="pill" style="color:${dr<=7?"var(--alto)":"var(--dim)"}">faltan ${dr} d</span>`;
    return `<button class="pcard" data-proy="${p.id}" style="border-color:color-mix(in srgb,${a.v} 46%,transparent);background:color-mix(in srgb,${a.v} 8%,var(--panel))">

      <span class="pcard-s"><span>${hechas}/${ts.length} tareas · ${pct}%</span>${cd}</span></button>`;

}

/* ---------- HORARIO ---------- */
function vHorario(){
  const ms = S.materias.filter(m => m.activa !== false);
  if(!ms.length) return `<div class="empty"><b>Sin materias</b>
    <span>Toca + para capturar tus asignaturas: clave, horario, aula y profesor.</span></div>`;

  const D = ["Lun","Mar","Mié","Jue","Vie","Sáb"];
  // los días y bloques salen de los datos, no de una lista fija
  const usados = new Set();
  const rangos = new Set();
  ms.forEach(m => Object.entries(m.dias||{}).forEach(([d,r]) => { usados.add(d); rangos.add(r); }));
  const dias = D.filter(d => usados.has(d));
  const bloques = [...rangos].sort((a,b) => a.localeCompare(b));
  const periodo = ms.find(m => m.periodo)?.periodo || "Periodo actual";

  let grid = `<div class="sch-grid" style="grid-template-columns:52px repeat(${dias.length},1fr)">
    <div class="sch-h" style="text-align:right;padding-right:4px">Hora</div>` +
    dias.map(d => `<div class="sch-h">${d}</div>`).join("");

  bloques.forEach(r => {
    grid += `<div class="sch-time">${r.split("-")[0]}</div>`;
    dias.forEach(d => {
      const mat = ms.find(m => (m.dias||{})[d] === r);
      grid += mat
        ? `<button class="sch-cell act" data-materia="${mat.id}">
             <span class="sch-tag">${esc(mat.nombre)}</span>
             <span class="sch-sub">${esc(corto2(mat.profesor))}</span></button>`
        : `<div class="sch-cell"><span style="color:var(--dim2);font-size:12px">-</span></div>`;
    });
  });
  grid += `</div>`;

  const lista = `<div class="list" style="margin-top:14px">` + ms.map(m => {
    const dtxt = Object.entries(m.dias||{}).map(([d,r]) => `${d} ${r}`).join(" · ");
    return `<button class="row pcard" data-materia="${m.id}" style="border-color:color-mix(in srgb,var(--escuela) 45%,transparent);background:color-mix(in srgb,var(--escuela) 7%,var(--panel));flex-direction:column;padding:12px;gap:6px;text-align:left;width:100%">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;width:100%">
        <div><span style="font-family:var(--mono);font-size:10px;color:var(--escuela);font-weight:700">${esc(m.clave||"")}${m.nivel?" ("+esc(m.nivel)+")":""}</span>
          <div style="font-size:14px;font-weight:600;margin-top:2px;color:var(--tx)">${esc(m.nombre)}</div></div>
        ${m.aula?`<span class="pill" style="background:color-mix(in srgb,var(--escuela) 20%,var(--panel));color:var(--escuela);font-size:9px">${esc(m.aula)}</span>`:""}
      </div>
      ${dtxt?`<div style="font-size:11.5px;color:var(--tx);font-weight:500;margin-top:4px">⏰ ${dtxt}</div>`:""}
      ${m.profesor?`<div style="font-size:11px;color:var(--dim)">👨‍🏫 ${esc(m.profesor)}</div>`:""}
    </button>`;
  }).join("") + `</div>`;

  return `<div class="sec">
    <div class="sec-h"><h2 class="sec-t">${esc(periodo)}</h2>
      <button class="sec-a" data-nuevamat="1">+ Materia</button></div>
    ${grid}
  </div>
  <div class="sec" style="margin-top:24px">
    <div class="sec-h"><h2 class="sec-t">Detalle de asignaturas</h2></div>
    ${lista}
  </div>`;
}

/* ---------- Formulario de materia ---------- */
function formMateria(m){
  m = m || {};
  const nuevo = !m.id;
  const D = ["Lun","Mar","Mié","Jue","Vie","Sáb"];
  const prev = Object.entries(m.dias||{});
  let dias = prev.map(([d]) => d);
  let ini = prev.length ? prev[0][1].split("-")[0] : "";
  let fin = prev.length ? prev[0][1].split("-")[1] : "";

  const pintar = () => {
    hoja(`<h2 class="sheet-h">${nuevo?"Nueva materia":"Materia"}</h2>
      <label class="lab">Nombre</label>
      <input id="m-nom" class="fld" value="${esc(m.nombre||"")}" placeholder="Seminario de Investigación II">
      <div class="two"><div><label class="lab">Clave</label>
        <input id="m-cla" class="fld" value="${esc(m.clave||"")}" placeholder="DCC07"></div>
        <div><label class="lab">Nivel</label>
        <input id="m-niv" class="fld" value="${esc(m.nivel||"")}" placeholder="3°"></div></div>
      <label class="lab">Días</label>
      <div class="dchips" id="m-dias">${D.map(d=>
        `<button data-d="${d}" class="dchip ${dias.includes(d)?"on":""}">${d}</button>`).join("")}</div>
      <div class="two"><div><label class="lab">Empieza</label>
        <input id="m-ini" type="time" class="fld" value="${ini}"></div>
        <div><label class="lab">Termina</label>
        <input id="m-fin" type="time" class="fld" value="${fin}"></div></div>
      <label class="lab">Aula</label>
      <input id="m-aul" class="fld" value="${esc(m.aula||"")}" placeholder="POSGRADO-B">
      <label class="lab">Profesor</label>
      <input id="m-pro" class="fld" value="${esc(m.profesor||"")}" placeholder="Apellidos Nombre">
      <label class="lab">Periodo</label>
      <input id="m-per" class="fld" value="${esc(m.periodo||"")}" placeholder="Periodo 2026 - 3">
      <div class="acts"><button id="m-no" class="btn" style="flex:.7;color:var(--dim)">Cancelar</button>
        <button id="m-ok" class="btn btn-p" style="flex:1.3">Guardar</button></div>
      ${nuevo?"":`<button id="m-del" class="btn btn-d" style="width:100%;margin-top:10px">Eliminar materia</button>`}`);

    const leer = () => { ini = $("m-ini").value; fin = $("m-fin").value; };
    document.querySelectorAll("#m-dias button").forEach(b => b.onclick = () => {
      leer(); const d = b.dataset.d;
      dias = dias.includes(d) ? dias.filter(x=>x!==d) : [...dias, d];
      m = { ...m, nombre:$("m-nom").value, clave:$("m-cla").value, nivel:$("m-niv").value,
            aula:$("m-aul").value, profesor:$("m-pro").value, periodo:$("m-per").value };
      pintar();
    });
    $("m-no").onclick = cerrar;
    if($("m-del")) $("m-del").onclick = () => {
      if(confirm("¿Eliminar esta materia?")){ cerrar(); borrar("ag_materias", m.id); } };
    $("m-ok").onclick = async () => {
      const nombre = $("m-nom").value.trim();
      if(!nombre) return $("m-nom").focus();
      leer();
      if(dias.length && !(ini && fin)) return alert("Falta la hora de inicio o de término.");
      const rango = ini && fin ? `${ini}-${fin}` : null;
      const mapa = {}; if(rango) dias.forEach(d => mapa[d] = rango);
      const fila = { nombre, clave:$("m-cla").value.trim()||null, nivel:$("m-niv").value.trim()||null,
        aula:$("m-aul").value.trim()||null, profesor:$("m-pro").value.trim()||null,
        periodo:$("m-per").value.trim()||null, dias:mapa, activa:true };
      $("m-ok").disabled = true;
      await guardar("ag_materias", nuevo ? fila : { id:m.id, ...fila });
      cerrar();
    };
  };
  pintar();
}

/* ---------- REPASO ---------- */
function vRepaso(){
  const l = lunes(hoyISO());
  const sem = S.tareas.filter(t => (t.hecha ? localISO(t.hecha_en) : t.fecha) >= l);
  let h = `<div class="sec"><div class="sec-h"><h2 class="sec-t">Esta semana por área</h2></div>`;
  Object.entries(AREAS).forEach(([k,a])=>{
    const ts = sem.filter(t=>t.area===k), hh = ts.filter(t=>t.hecha).length;
    const pct = ts.length ? Math.round(hh/ts.length*100) : 0;
    h += `<div class="rp"><span class="rp-k" style="color:${a.v}">${a.l}</span>
      <span class="rp-bar"><i style="width:${pct}%;background:${a.v}"></i></span>
      <span class="rp-n">${hh}/${ts.length}</span></div>`;
  });
  h += `</div>`;

  /* racha */
  let racha = 0;
  for(let i=0;i<60;i++){
    const k = addD(hoyISO(),-i);
    const hay = S.tareas.some(t=>t.hecha && localISO(t.hecha_en)===k);
    if(hay) racha++; else if(i>0) break;
  }
  const cerradas = S.tareas.filter(t=>t.hecha && localISO(t.hecha_en) >= l).length;
  h += `<div class="kpis" style="margin-top:22px">
    <div class="kpi"><div class="kpi-n" style="color:var(--ok)">${cerradas}</div><div class="kpi-l">cerradas esta semana</div></div>
    <div class="kpi"><div class="kpi-n">${racha}</div><div class="kpi-l">días de racha</div></div>
    <div class="kpi"><div class="kpi-n" style="color:${vencidas().length?"var(--alert)":"inherit"}">${vencidas().length}</div><div class="kpi-l">arrastradas</div></div>
  </div>`;

  /* --- historial de cierres, agrupado por día --- */
  const hechas = S.tareas.filter(t=>t.hecha && t.hecha_en)
    .sort((a,b)=>b.hecha_en.localeCompare(a.hecha_en));
  const porDia = {};
  hechas.forEach(t => { const k = localISO(t.hecha_en); (porDia[k] ||= []).push(t); });
  const dias = Object.keys(porDia).sort().reverse().slice(0, S.masHist ? 60 : 7);

  h += `<div class="sec"><div class="sec-h"><h2 class="sec-t">Historial de cierres</h2>
    <span style="font-family:var(--mono);font-size:11px;color:var(--dim2)">${hechas.length} en total</span></div>` +
    (dias.length ? dias.map(k=>`<div style="margin-top:13px">
      <h3 class="sec-t" style="margin:0 0 7px;color:var(--dim2)">${nomDia(k)}<span style="opacity:.6"> · ${porDia[k].length}</span></h3>
      <ul class="list">${porDia[k].map(t=>fila(t)).join("")}</ul></div>`).join("")
      : `<div class="empty"><span>Aquí se irá guardando todo lo que cierres, con fecha y hora.</span></div>`) +
    (Object.keys(porDia).length > dias.length || S.masHist
      ? `<button class="mas" data-hist="1">${S.masHist?"Ver menos":"Ver historial completo ⌄"}</button>` : "") +
    `</div>`;

  const late = ordena(vencidas());
  h += `<div class="sec"><div class="sec-h"><h2 class="sec-t ${late.length?"alert":""}">Qué se está arrastrando</h2></div>` +
    (late.length ? `<ul class="list">${late.map(t=>fila(t,true)).join("")}</ul>`
      : `<div class="empty"><b>Al corriente</b><span>No traes nada vencido. Buen cierre de semana.</span></div>`) + `</div>`;
  return h;
}

/* ===================== Eventos de la vista ===================== */
function enlazar(){
  const v = $("view");
  v.querySelectorAll("[data-abrir]").forEach(b => b.onclick = () => formTarea(S.tareas.find(t=>t.id===b.dataset.abrir)));
  v.querySelectorAll("[data-check]").forEach(b => b.onclick = () => alternar(b.dataset.check));
  v.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { S.agFecha=b.dataset.goto; S.agModo="mes"; S.tab="agenda"; render(); });
  v.querySelectorAll("[data-filtro]").forEach(b => b.onclick = () => { S.filtro=b.dataset.filtro; render(false); });
  v.querySelectorAll("[data-hechas]").forEach(b => b.onclick = () => { S.verHechas=!S.verHechas; render(false); });
  v.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => { S.agModo=b.dataset.modo; render(false); });
  v.querySelectorAll("[data-mov]").forEach(b => b.onclick = () => {
    const n = +b.dataset.mov;
    if(n===0) S.agFecha = hoyISO();
    else if(S.agModo==="mes"){ const d = dISO(S.agFecha); d.setDate(1); d.setMonth(d.getMonth()+n); S.agFecha = iso(d); }
    else S.agFecha = addD(S.agFecha, n * (S.agModo==="semana"?7:1));
    render(false);
  });
  v.querySelectorAll("[data-slot]").forEach(b => b.onclick = () => {
    const [f,h] = b.dataset.slot.split("|");
    formTarea({ fecha:f, hora:h });
  });

  const inp = v.querySelector("#q");
  if(inp) inp.oninput = () => { S.q = inp.value; render(false); const n=$("q"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } };
  v.querySelectorAll("[data-alhoy]").forEach(b => b.onclick = pasarAHoy);
  v.querySelectorAll("[data-materia]").forEach(b => b.onclick = () => menuMateria(S.materias.find(x=>x.id===b.dataset.materia)));
  v.querySelectorAll("[data-nuevamat]").forEach(b => b.onclick = () => formMateria());
  v.querySelectorAll("[data-hist]").forEach(b => b.onclick = () => { S.masHist = !S.masHist; render(false); });
  v.querySelectorAll("[data-dia]").forEach(b => b.onclick = () => { S.agFecha=b.dataset.dia; render(); });
  v.querySelectorAll("[data-verdia]").forEach(b => b.onclick = () => { S.agModo="dia"; render(false); });
  v.querySelectorAll("[data-proy]").forEach(b => b.onclick = () => { S.proy=b.dataset.proy; render(); });
  v.querySelectorAll("[data-volver]").forEach(b => b.onclick = () => { S.proy=null; render(false); });
  v.querySelectorAll("[data-editproy]").forEach(b => b.onclick = e => { e.stopPropagation(); formProyecto(proyDe(b.dataset.editproy)); });
  v.querySelectorAll("[data-nuevatarea]").forEach(b => b.onclick = () => formTarea({ proyecto_id:b.dataset.nuevatarea, area:proyDe(b.dataset.nuevatarea)?.area }));
  v.querySelectorAll("[data-nuevanota]").forEach(b => b.onclick = () => formNota(b.dataset.nuevanota));
  v.querySelectorAll("[data-delnota]").forEach(b => b.onclick = () => { if(confirm("¿Eliminar esta nota?")) borrar("ag_notas", b.dataset.delnota); });
}

async function alternar(id){
  const t = S.tareas.find(x=>x.id===id); if(!t) return;
  await guardar("ag_tareas", { id, hecha:!t.hecha, hecha_en: t.hecha ? null : new Date().toISOString() });
}

async function pasarAHoy(){
  const ids = vencidas().map(t=>t.id);
  if(!ids.length || !confirm(`¿Mover ${ids.length} tarea${ids.length>1?"s":""} a hoy?`)) return;
  const { error } = await sb.from("ag_tareas").update({ fecha:hoyISO() }).in("id", ids);
  if(error) return alert("No se pudieron mover: " + error.message);
  await cargar(); render(false);
}

function exportCSV(){
  const cab = ["titulo","area","proyecto","fecha","hora","duracion_min","prioridad_alta","hecha","cerrada_en","nota"];
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const filas = ordena(S.tareas).map(t => [t.titulo, AREAS[t.area]?.l||t.area, proyDe(t.proyecto_id)?.nombre||"",
    t.fecha||"", corto(t.hora||""), t.duracion, t.alta?"sí":"no", t.hecha?"sí":"no",
    t.hecha_en ? new Date(t.hecha_en).toLocaleString("es-MX") : "", t.nota||""].map(q).join(","));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff"+cab.join(",")+"\n"+filas.join("\n")],{type:"text/csv;charset=utf-8"}));
  a.download = `agendaapp-${hoyISO()}.csv`; a.click(); cerrar();
}

/* ===================== Modal ===================== */
function cerrar(){ $("modal").innerHTML = ""; }
document.addEventListener("keydown", e => {
  if(e.key==="Escape" && $("modal").innerHTML){ e.preventDefault(); cerrar(); }
});
function hoja(html){
  $("modal").innerHTML = `<div class="ov" id="ov"><div class="sheet" id="sh"><div class="grip"></div>${html}</div></div>`;
  $("ov").onclick = e => { if(e.target.id==="ov") cerrar(); };
}

/* ---------- Formulario de tarea ---------- */
function formTarea(t){
  t = t || {};
  const nuevo = !t.id;
  let expand = !nuevo;
  const f = {
    titulo:t.titulo||"", area:t.area||"trabajo", proyecto_id:t.proyecto_id||"",
    fecha:t.fecha ?? hoyISO(), hora:corto(t.hora||""), duracion:t.duracion??60,
    alta:!!t.alta, nota:t.nota||"", checklist: Array.isArray(t.checklist)?[...t.checklist]:[]
  };
  let dias = [], semanas = 4;

  const leer = () => {
    if($("f-tit")) f.titulo = $("f-tit").value;
    if($("f-fec")) f.fecha  = $("f-fec").value || null;
    if($("f-hor")) f.hora   = $("f-hor").value || null;
    if($("f-proy")) f.proyecto_id = $("f-proy").value;
    if($("f-dur"))  f.duracion    = +$("f-dur").value;
    if($("f-not"))  f.nota        = $("f-not").value;
    if($("f-sem"))  semanas       = +$("f-sem").value;
    document.querySelectorAll("[data-cli]").forEach(i => { f.checklist[+i.dataset.cli].t = i.value; });
  };

  const pintar = () => {
    const segArea = `<div class="seg" id="f-area">${Object.entries(AREAS).map(([k,a])=>
      `<button data-a="${k}" style="${f.area===k?`background:${a.v};color:#fff;border-color:transparent`
        :`color:${a.v};border-color:${a.v}`}">${a.l}</button>`).join("")}</div>`;

    hoja(`<h2 class="sheet-h">${nuevo?"Nueva tarea":"Tarea"}</h2>
      ${!nuevo&&t.hecha?`<p class="sheet-s">Cerrada el ${new Date(t.hecha_en).toLocaleString("es-MX",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</p>`:""}

      <label class="lab">Qué hay que hacer</label>
      <input id="f-tit" class="fld" value="${esc(f.titulo)}" placeholder="Revisar capítulo 3" enterkeyhint="done">

      <label class="lab">Área</label>${segArea}

      <div class="two" style="margin-top:16px">
        <div><label class="lab" style="margin-top:0">Fecha</label>
          <input id="f-fec" type="date" class="fld" value="${f.fecha||""}"></div>
        <div><label class="lab" style="margin-top:0">Hora</label>
          <input id="f-hor" type="time" class="fld" value="${f.hora||""}"></div></div>
      <div class="mact" style="padding:9px 0 0">
        <button data-pos="0">Hoy</button><button data-pos="1">Mañana</button>
        <button data-pos="7">+1 sem</button>
        <button data-hora="x" style="${!f.hora?"border-color:var(--escuela);color:var(--escuela)":""}">Todo el día</button></div>

      ${expand ? `
      <label class="lab">Proyecto</label>
      <select id="f-proy" class="fld"><option value="">Sin proyecto</option>${
        S.proyectos.filter(p=>!p.archivado).map(p=>`<option value="${p.id}" ${f.proyecto_id===p.id?"selected":""}>${esc(p.nombre)}</option>`).join("")}</select>

      <label class="lab">Duración</label>
      <select id="f-dur" class="fld">${[15,30,45,60,90,120,180,240].map(m=>
        `<option value="${m}" ${f.duracion===m?"selected":""}>${m<60?m+" min":(m/60)+" h"}</option>`).join("")}</select>

      ${nuevo?`<label class="lab">Repetir en estos días</label>
      <div class="dchips" id="f-dias">${DIAS.map((d,i)=>`<button data-d="${i}" class="dchip ${dias.includes(i)?"on":""}">${d}</button>`).join("")}</div>
      <label class="lab">Durante cuántas semanas</label>
      <select id="f-sem" class="fld">${[1,2,4,8,12,16].map(n=>`<option value="${n}" ${semanas===n?"selected":""}>${n} semana${n>1?"s":""}</option>`).join("")}</select>`:""}

      <button id="f-alta" class="btn" style="margin-top:16px;display:flex;align-items:center;gap:9px;justify-content:flex-start;${f.alta?"border-color:var(--alto);color:var(--alto)":""}">
        <span class="mono">${f.alta?"!":"○"}</span> Prioridad alta</button>

      <label class="lab">Pasos</label><div id="f-cl">${f.checklist.map((c,i)=>
        `<div class="cl-row"><button data-clt="${i}" class="chk-b" style="${c.h?"border-color:var(--ok);color:var(--ok)":""}">${c.h?"✓":""}</button>
         <input type="text" data-cli="${i}" value="${esc(c.t)}" placeholder="Paso"><button data-clx="${i}" class="cl-x">×</button></div>`).join("")}
        <button id="f-cladd" class="sec-a" style="margin-top:6px">+ Agregar paso</button></div>

      <label class="lab">Nota</label>
      <textarea id="f-not" class="fld" rows="2" placeholder="Opcional">${esc(f.nota)}</textarea>
      ` : `<button id="f-mas" class="mas">Más opciones ⌄</button>`}

      <div class="acts"><button id="f-no" class="btn" style="flex:.7;color:var(--dim)">Cancelar</button><button id="f-ok" class="btn btn-p" style="flex:1.3">Guardar</button></div>
      ${nuevo?"":`<div class="mact" style="padding:12px 0 0"><button id="f-dup">Duplicar</button>
        <button id="f-del" style="color:var(--alert)">Eliminar</button></div>`}`);

    document.querySelectorAll("#f-area button").forEach(b => b.onclick = () => { leer(); f.area = b.dataset.a; pintar(); });
    document.querySelectorAll("[data-pos]").forEach(b => b.onclick = () => { leer(); f.fecha = addD(hoyISO(), +b.dataset.pos); pintar(); });
    document.querySelectorAll("[data-hora]").forEach(b => b.onclick = () => { leer(); f.hora = null; pintar(); });
    if($("f-mas")) $("f-mas").onclick = () => { leer(); expand = true; pintar(); };
    if($("f-dias")) document.querySelectorAll("#f-dias button").forEach(b => b.onclick = () => {
      leer(); const i = +b.dataset.d; dias = dias.includes(i) ? dias.filter(x=>x!==i) : [...dias,i]; pintar(); });
    if($("f-alta")) $("f-alta").onclick = () => { leer(); f.alta = !f.alta; pintar(); };
    if($("f-cladd")) $("f-cladd").onclick = () => { leer(); f.checklist.push({t:"",h:false}); pintar(); };
    document.querySelectorAll("[data-clt]").forEach(b => b.onclick = () => { leer(); f.checklist[+b.dataset.clt].h = !f.checklist[+b.dataset.clt].h; pintar(); });
    document.querySelectorAll("[data-clx]").forEach(b => b.onclick = () => { leer(); f.checklist.splice(+b.dataset.clx,1); pintar(); });
    $("f-no").onclick = cerrar;
    $("f-tit").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); $("f-ok").click(); } };
    if(nuevo && !f.titulo) $("f-tit").focus();

    const arma = () => ({ titulo:f.titulo.trim(), area:f.area, proyecto_id:f.proyecto_id||null,
      fecha:f.fecha, hora:f.hora||null, duracion:f.duracion, alta:f.alta,
      nota:(f.nota||"").trim()||null, checklist:f.checklist.filter(c=>c.t.trim()) });

    if($("f-dup")) $("f-dup").onclick = async () => {
      leer(); await guardar("ag_tareas", { ...arma(), titulo:f.titulo.trim()+" (copia)" }); cerrar(); };
    if($("f-del")) $("f-del").onclick = () => {
      if(confirm("¿Eliminar la tarea?")){ cerrar(); borrar("ag_tareas", t.id); } };

    $("f-ok").onclick = async () => {
      leer();
      if(!f.titulo.trim()){ $("f-tit").focus(); return; }
      const base = arma();
      $("f-ok").disabled = true; $("f-ok").textContent = "Guardando…";
      if(nuevo && dias.length && f.fecha){
        const filas = [], l0 = lunes(f.fecha);
        for(let s=0;s<semanas;s++) dias.forEach(d => {
          const k = addD(addD(l0, s*7), d);
          if(k >= f.fecha) filas.push({ ...base, fecha:k });
        });
        await guardar("ag_tareas", filas.length ? filas : [base]);
      } else {
        await guardar("ag_tareas", nuevo ? base : { id:t.id, ...base });
      }
      cerrar();
    };
  };
  pintar();
}

/* ---------- Formulario de proyecto ---------- */
function formProyecto(p){
  p = p || {};
  const nuevo = !p.id;
  hoja(`<h2 class="sheet-h">${nuevo?"Nuevo proyecto":"Proyecto"}</h2>
    <label class="lab">Nombre</label>
    <input id="p-nom" class="fld" value="${esc(p.nombre||"")}" placeholder="Tesis · capítulo de resultados">
    <label class="lab">Área</label>
    <div class="seg" id="p-area">${Object.entries(AREAS).map(([k,a])=>{
      const on = (p.area||"escuela")===k;
      return `<button data-a="${k}" style="${on?`background:${a.v};color:var(--bg);border-color:transparent`:`color:${a.v};border-color:${a.v}`}">${a.l}</button>`;}).join("")}</div>
    <label class="lab">De qué se trata</label>
    <textarea id="p-det" class="fld" rows="2" placeholder="Opcional">${esc(p.detalle||"")}</textarea>
    <label class="lab">Fecha objetivo</label>
    <input id="p-ven" type="date" class="fld" value="${p.vence||""}">
    <div class="acts"><button id="p-ok" class="btn btn-p">Guardar</button><button id="p-no" class="btn">Cancelar</button></div>
    ${nuevo?"":`<button id="p-arch" class="btn" style="width:100%;margin-top:10px">${p.archivado?"Reactivar":"Archivar"}</button>
      <button id="p-del" class="btn btn-d" style="width:100%;margin-top:8px">Eliminar proyecto</button>`}`);

  let area = p.area || "escuela";
  document.querySelectorAll("#p-area button").forEach(b => b.onclick = () => {
    area = b.dataset.a;
    document.querySelectorAll("#p-area button").forEach(x=>{
      const a = AREAS[x.dataset.a], on = x.dataset.a===area;
      x.style.cssText = on ? `background:${a.v};color:var(--bg);border-color:transparent` : `color:${a.v};border-color:${a.v}`;
    });
  });
  $("p-no").onclick = cerrar;
  if($("p-arch")) $("p-arch").onclick = async () => { cerrar(); S.proy=null; await guardar("ag_proyectos",{ id:p.id, archivado:!p.archivado }); };
  if($("p-del")) $("p-del").onclick = async () => {
    if(!confirm("Se elimina el proyecto y su bitácora. Las tareas se conservan sueltas. ¿Continuar?")) return;
    cerrar(); S.proy=null; await borrar("ag_proyectos", p.id);
  };
  $("p-ok").onclick = async () => {
    const nombre = $("p-nom").value.trim();
    if(!nombre){ $("p-nom").focus(); return; }
    const fila = { nombre, area, detalle:$("p-det").value.trim()||null, vence:$("p-ven").value||null };
    $("p-ok").disabled = true;
    await guardar("ag_proyectos", nuevo ? fila : { id:p.id, ...fila });
    cerrar();
  };
}

/* ---------- Rutinas ---------- */
function formRutinas(){
  hoja(`<h2 class="sheet-h">Rutinas</h2>
    <p class="sheet-s">Un día tipo guardado: tu turno, tus bloques de tesis, la rutina del sábado. Lo aplicas a cualquier fecha sin recapturar.</p>
    ${S.rutinas.length ? `<div class="mnu">${S.rutinas.map(r=>`
      <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)">
        <div style="flex:1;min-width:0"><b>${esc(r.nombre)}</b>
          <small>${(r.items||[]).length} tarea${(r.items||[]).length===1?"":"s"}</small></div>
        <button class="sec-a" data-usar="${r.id}">Aplicar</button>
        <button style="color:var(--dim2);font-size:17px;padding:0 3px" data-delrut="${r.id}">&times;</button>
      </div>`).join("")}</div>`
      : `<div class="empty"><span>Todavía no guardas ninguna.</span></div>`}
    <label class="lab">Crear una con las tareas de un día</label>
    <input id="r-fec" type="date" class="fld" value="${hoyISO()}">
    <input id="r-nom" class="fld" style="margin-top:9px" placeholder="Nombre: turno matutino, día de tesis…">
    <div class="acts"><button id="r-ok" class="btn btn-p">Guardar rutina</button><button id="r-no" class="btn">Volver</button></div>`);

  $("r-no").onclick = cerrar;
  document.querySelectorAll("[data-usar]").forEach(b => b.onclick = () => aplicarRutina(S.rutinas.find(r=>r.id===b.dataset.usar)));
  document.querySelectorAll("[data-delrut]").forEach(b => b.onclick = async () => {
    if(!confirm("¿Eliminar esta rutina?")) return;
    await sb.from("ag_rutinas").delete().eq("id", b.dataset.delrut);
    await cargar(); formRutinas();
  });
  $("r-ok").onclick = async () => {
    const fecha = $("r-fec").value, nombre = $("r-nom").value.trim();
    if(!nombre) return $("r-nom").focus();
    const items = S.tareas.filter(t=>t.fecha===fecha).map(t=>({
      titulo:t.titulo, area:t.area, hora:t.hora, duracion:t.duracion, alta:t.alta,
      proyecto_id:t.proyecto_id, checklist:t.checklist||[] }));
    if(!items.length) return alert("Ese día no tiene tareas que guardar.");
    $("r-ok").disabled = true;
    const { error } = await sb.from("ag_rutinas").insert([{ nombre, items }]);
    if(error) return alert("No se guardó: " + error.message + "\n\n¿Ya corriste el SQL de rutinas?");
    await cargar(); formRutinas();
  };
}

function aplicarRutina(r){
  hoja(`<h2 class="sheet-h">${esc(r.nombre)}</h2>
    <p class="sheet-s">Se crearán ${(r.items||[]).length} tareas en la fecha que elijas.</p>
    <label class="lab">Fecha</label><input id="a-fec" type="date" class="fld" value="${hoyISO()}">
    <div class="acts"><button id="a-ok" class="btn btn-p">Aplicar</button><button id="a-no" class="btn">Volver</button></div>`);
  $("a-no").onclick = formRutinas;
  $("a-ok").onclick = async () => {
    const fecha = $("a-fec").value; if(!fecha) return;
    $("a-ok").disabled = true;
    await guardar("ag_tareas", (r.items||[]).map(i=>({ ...i, fecha })));
    cerrar();
  };
}

/* ---------- Gesto Swipe Global ---------- */
(function initSwipe() {
  let startX = 0, startY = 0; let startEl = null;
  const TABS = ["hoy", "pendientes", "agenda", "proyectos", "horario", "repaso"];

  document.addEventListener("touchstart", e => {
    startX = e.changedTouches[0].screenX;
    startY = e.changedTouches[0].screenY;
    startEl = e.target;              // dónde NACIÓ el gesto, no dónde terminó
  }, {passive: true});

  document.addEventListener("touchend", e => {
    // Ignorar si hay un modal o el menú lateral abierto
    if ($("sidebar").classList.contains("open") || $("modal").innerHTML !== "") return;

    const endX = e.changedTouches[0].screenX;
    const endY = e.changedTouches[0].screenY;
    const deltaX = endX - startX;
    const deltaY = endY - startY;

    // Detectar swipe horizontal claro (para no confundirlo con el scroll hacia abajo)
    if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
      
      // Evitar cambio de pestaña si hacemos swipe en áreas de scroll horizontal nativo
      const org = startEl || e.target;
      if (org.closest && org.closest('.chips, .sch-grid, .busca')) return;

      // En Agenda el calendario se queda con el gesto SOLO si nace dentro de él.
      // Fuera del calendario (KPIs, encabezado, lista de abajo) el swipe
      // vuelve a cambiar de pestaña.
      const enCalendario = org.closest && org.closest('.mes, .grid');
      if (S.tab === "agenda" && enCalendario) {
        // En agenda, el swipe cambia la fecha/semana/mes
        if (deltaX < -50) {
          const btn = document.querySelector('.ag-arrow[data-mov="1"]');
          if (btn) btn.click();
        } else if (deltaX > 50) {
          const btn = document.querySelector('.ag-arrow[data-mov="-1"]');
          if (btn) btn.click();
        }
      } else {
        // Navegación entre pestañas
        const idx = TABS.indexOf(S.tab);
        if (deltaX < -50 && idx < TABS.length - 1) {
          document.querySelector(`.side-nav button[data-tab="${TABS[idx + 1]}"]`).click();
        } else if (deltaX > 50 && idx > 0) {
          document.querySelector(`.side-nav button[data-tab="${TABS[idx - 1]}"]`).click();
        }
      }
    }
  }, {passive: true});
})();

/* ---------- Interpretación del dictado ---------- */
const SEMANA = { domingo:0, lunes:1, martes:2, miercoles:3, jueves:4, viernes:5, sabado:6 };
const MESES = { enero:0, febrero:1, marzo:2, abril:3, mayo:4, junio:5, julio:6,
  agosto:7, septiembre:8, setiembre:8, octubre:9, noviembre:10, diciembre:11 };
const CLAVES = {
  escuela:  ["escuela","tesis","doctorado","capitulo","asesor","articulo","clase","maestria","universidad","seminario","paper","revision de literatura"],
  trabajo:  ["trabajo","c5","turno","guardia","reporte","oficina","junta","analista","ppt","presentacion","tablero","operativo","bitacora","auditoria"],
  personal: ["personal","casa","familia","esposa","hijo","doctor","dentista","banco","pago","consultorio","despensa","cita medica"]
};

const MAPA = {á:"a",à:"a",ä:"a",â:"a",é:"e",è:"e",ë:"e",ê:"e",í:"i",ì:"i",ï:"i",î:"i",
  ó:"o",ò:"o",ö:"o",ô:"o",ú:"u",ù:"u",ü:"u",û:"u",ñ:"n"};
const fold = s => s.toLowerCase().replace(/[áàäâéèëêíìïîóòöôúùüûñ]/g, c => MAPA[c]);

function parseVoz(crudo, hoy){
  const t = fold(crudo);
  const base = hoy ? new Date(hoy) : new Date();
  base.setHours(0,0,0,0);
  const p2 = n => String(n).padStart(2,"0");
  const iso = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
  const mas = n => { const d = new Date(base); d.setDate(d.getDate()+n); return iso(d); };
  const cortes = [];
  const fechas = [];
  let hora = null, alta = false;

  const cazar = (re, fn) => {
    let m;
    const rx = new RegExp(re, "g");
    while((m = rx.exec(t)) !== null){ if(fn(m) !== false) cortes.push([m.index, m.index + m[0].length]); }
  };

  /* --- hora --- */
  cazar("\\ba\\s+las?\\s+(\\d{1,2})(?::(\\d{2}))?\\s*(de\\s+la\\s+(?:manana|tarde|noche)|am|pm|hrs?|horas)?", m => {
    let h = +m[1]; const min = m[2] ? +m[2] : 0; const suf = m[3] || "";
    if(/tarde|noche|pm/.test(suf) && h < 12) h += 12;
    if(/manana|am/.test(suf) && h === 12) h = 0;
    if(!suf && h >= 1 && h <= 6) h += 12;
    if(h > 23) return false;
    hora = `${p2(h)}:${p2(min)}`;
  });

  /* --- prioridad --- */
  cazar("\\b(urgente|es urgente|prioridad alta|muy importante)\\b", () => { alta = true; });

  /* --- fechas relativas --- */
  cazar("\\bhoy\\b",                        () => fechas.push(mas(0)));
  cazar("\\bpasado\\s+manana\\b",           () => fechas.push(mas(2)));
  cazar("(?<!de\\s*la\\s)(?<!pasado\\s)\\bmanana\\b", () => fechas.push(mas(1)));
  cazar("\\b(?:la\\s+)?proxima semana\\b",  () => fechas.push(mas(7)));
  cazar("\\ben\\s+(\\d{1,2})\\s+dias?\\b",  m => fechas.push(mas(+m[1])));

  /* --- días de la semana --- */
  cazar("\\b(?:el\\s+|este\\s+|la\\s+)?(proximo|proxima|siguiente)?\\s*(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\\b", m => {
    const objetivo = SEMANA[m[2]];
    let delta = (objetivo - base.getDay() + 7) % 7;
    if(delta === 0) delta = 7;
    const cand = new Date(base); cand.setDate(cand.getDate()+delta);
    const finSemana = new Date(base);
    finSemana.setDate(finSemana.getDate() + ((7 - ((base.getDay()+6)%7)) % 7 || 7));
    if(m[1] && cand < finSemana) cand.setDate(cand.getDate()+7);
    fechas.push(iso(cand));
  });

  /* --- fechas con número de día --- */
  cazar("\\bel\\s+(\\d{1,2})\\s+de\\s+(" + Object.keys(MESES).join("|") + ")\\b", m => {
    const d = new Date(base.getFullYear(), MESES[m[2]], +m[1]);
    if(d < base) d.setFullYear(d.getFullYear()+1);
    fechas.push(iso(d));
  });
  cazar("\\bel\\s+(\\d{1,2})\\b(?!\\s*(?::|de\\s|hrs|horas))", m => {
    const dia = +m[1]; if(dia < 1 || dia > 31) return false;
    const d = new Date(base.getFullYear(), base.getMonth(), dia);
    if(d < base) d.setMonth(d.getMonth()+1);
    fechas.push(iso(d));
  });

  /* --- título --- */
  cortes.sort((a,b) => b[0]-a[0]);
  let titulo = crudo;
  cortes.forEach(([a,b]) => { titulo = titulo.slice(0,a) + " " + titulo.slice(b); });
  titulo = titulo
    .replace(/^\s*(agenda(r|me)?|agrega(r|me)?|anota(r|me)?|apunta(r|me)?|recu[eé]rda(me)?|recordar|nueva tarea|tarea|pon(er|me)?)\s*:?\s*/i, "")
    .replace(/\b(para|el d[ií]a|y tambi[eé]n|tambi[eé]n)\b/gi, " ")
    .replace(/[,;]+/g, " ")
    .replace(/\s+y\s*$/i, " ")
    .replace(/\s+/g, " ")
    .trim();

  /* --- área --- */
  let area = "trabajo";
  for(const [k, palabras] of Object.entries(CLAVES))
    if(palabras.some(p => t.includes(p))){ area = k; break; }

  const unicas = [...new Set(fechas)].sort();
  return {
    titulo: titulo ? titulo[0].toUpperCase() + titulo.slice(1) : "",
    area, alta, hora,
    fechas: unicas.length ? unicas : [mas(0)]
  };
}

/* ---------- Dictado ---------- */
let toastT;
function toast(msg, ids){
  const el = $("toast");
  el.innerHTML = `<span style="flex:1;font-size:13.5px;line-height:1.35">${esc(msg)}</span>` +
    (ids && ids.length ? `<button id="t-undo" style="color:var(--alert);font-weight:600;font-size:13px;flex:none">Deshacer</button>` : "") +
    `<button id="t-x" style="color:var(--dim2);font-size:17px;flex:none">&times;</button>`;
  el.classList.remove("hide");
  if($("t-undo")) $("t-undo").onclick = async () => {
    el.classList.add("hide");
    await sb.from("ag_tareas").delete().in("id", ids);
    await cargar(); render(false);
  };
  $("t-x").onclick = () => el.classList.add("hide");
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.add("hide"), 10000);
}

function dictar(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("Este navegador no reconoce voz.\nEn Android usa Chrome; en iPad, Safari."); return formTarea({}); }
  const r = new SR();
  r.lang = "es-MX"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  let texto = "", cancelado = false;

  $("modal").innerHTML = `<div class="voz">
    <div class="voz-orb"></div>
    <p class="voz-h">Escuchando</p>
    <p class="voz-tx" id="voz-tx" style="color:var(--dim2)">Di qué hacer y para cuándo</p>
    <button class="btn" id="voz-x" style="min-width:160px;margin-top:8px">Cancelar</button></div>`;
  $("voz-x").onclick = () => { cancelado = true; try{ r.stop(); }catch(_){} cerrar(); };

  r.onresult = e => {
    texto = Array.from(e.results).map(x => x[0].transcript).join(" ");
    const el = $("voz-tx");
    if(el){ el.textContent = texto; el.style.color = "var(--tx)"; }
  };
  r.onerror = e => {
    if(cancelado) return;
    cerrar();
    if(e.error === "not-allowed") alert("Chrome necesita permiso del micrófono para esta página.");
    else if(e.error !== "aborted") toast("No se escuchó nada. Intenta otra vez.");
  };
  r.onend = async () => {
    if(cancelado) return;
    cerrar();
    if(texto.trim()) await crearDesdeVoz(texto);
  };
  try{ r.start(); }catch(_){ cerrar(); }
}

async function crearDesdeVoz(texto){
  const p = parseVoz(texto);
  if(!p.titulo){ toast("No entendí qué agendar."); return; }
  const filas = p.fechas.map(f => ({ titulo:p.titulo, area:p.area, fecha:f, hora:p.hora,
    duracion:60, alta:p.alta, checklist:[], proyecto_id:null, nota:null }));
  const { data, error } = await sb.from("ag_tareas").insert(filas).select("id");
  if(error){ alert("No se guardó: " + error.message); return; }
  await cargar(); render(false);
  const cuando = p.fechas.map(f => nomDia(f)).join(" · ");
  toast(`${p.titulo} — ${cuando}${p.hora ? " a las " + p.hora : ""}`, (data||[]).map(x => x.id));
}

  if(S.tab==="proyectos" && !S.proy) return formProyecto();
  if(S.tab==="proyectos" && S.proy) return formTarea({ proyecto_id:S.proy, area:proyDe(S.proy)?.area });
  if(S.tab==="horario") return formMateria();
  if(S.tab==="agenda") return formTarea({ fecha:S.agFecha });

};
$("mic").onclick = dictar;

sb.auth.onAuthStateChange((ev, sesion) => {

});
arranque();
if("serviceWorker" in navigator)
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
